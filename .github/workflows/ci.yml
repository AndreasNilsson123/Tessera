name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR supersedes the one still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Build + test on every platform with warnings as errors. Windows currently has the only native
  # backend (WGL); the other platforms build and test the core until their backends land (Phases 3-5).
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # macOS has never produced a result (its runner was cancelled at once in every run so far): do not let it block until it has.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-msvc-debug,   os: windows-2022, config: Debug }
          - { name: windows-msvc-release, os: windows-2022, config: Release }
          - { name: linux-gcc-debug,      os: ubuntu-24.04, config: Debug,   cc: gcc,   cxx: g++ }
          - { name: linux-gcc-release,    os: ubuntu-24.04, config: Release, cc: gcc,   cxx: g++ }
          - { name: linux-clang-debug,    os: ubuntu-24.04, config: Debug,   cc: clang, cxx: clang++ }
          - { name: macos-arm64-debug,    os: macos-latest, config: Debug, experimental: true }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ci -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - name: Build
        run: cmake --build --preset ci --config ${{ matrix.config }} --parallel
      - name: Test (no GPU required)
        run: ctest --preset ci -C ${{ matrix.config }}

  # Memory/UB and data-race checking of the core logic (handle table, init/terminate, thread ownership).
  sanitizers:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [asan-ubsan, tsan]
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Lower ASLR entropy (TSan aborts under the runners' default)
        if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # A minute of libFuzzer per target (clang, ASan + UBSan) from the seed corpus: catches regressions in the parsers and the
  # struct-size handling. The long runs are in nightly.yml.
  fuzz:
    name: libFuzzer (short)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake --preset fuzz
          cmake --build --preset fuzz --parallel
      - name: Fuzz
        run: |
          for t in fuzz_api fuzz_glversion; do
            ./build/fuzz/tests/$t -max_total_time=60 -timeout=20 "tests/fuzz/corpus/$t"
          done

  # The Conan recipe: builds the package from the checkout and runs the consumer test (find_package + link + init/terminate).
  conan:
    name: conan package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install conan
      - run: conan profile detect --force
      - run: conan create packaging/conan --build=missing -s build_type=Release

  # The vcpkg port, installed from the checked-out tree through an overlay port (TESSERA_LOCAL_SOURCE) and consumed with
  # find_package from a tiny project. The runners ship vcpkg (VCPKG_INSTALLATION_ROOT).
  vcpkg:
    name: vcpkg port (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install the port
        shell: bash
        env:
          TESSERA_LOCAL_SOURCE: ${{ github.workspace }}
          # vcpkg builds in a sanitised environment; this lets the overlay port see the checkout.
          VCPKG_KEEP_ENV_VARS: TESSERA_LOCAL_SOURCE
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install tessera --overlay-ports=packaging/vcpkg/ports --x-install-root="$RUNNER_TEMP/vcpkg_installed"
      - name: Build and run a consumer
        shell: bash
        run: |
          TRIPLET=$(ls "$RUNNER_TEMP/vcpkg_installed" | grep -v vcpkg | head -1)
          cmake -S packaging/conan/test_package -B "$RUNNER_TEMP/consumer"             -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/vcpkg_installed/$TRIPLET" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/consumer" --config Release
          export PATH="$RUNNER_TEMP/vcpkg_installed/$TRIPLET/bin:$PATH"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/vcpkg_installed/$TRIPLET/lib:${LD_LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="$RUNNER_TEMP/vcpkg_installed/$TRIPLET/lib:${DYLD_LIBRARY_PATH:-}"
          if [ -x "$RUNNER_TEMP/consumer/consumer" ]; then "$RUNNER_TEMP/consumer/consumer"; else "$RUNNER_TEMP/consumer/Release/consumer.exe"; fi

  # The WGL integration test against whatever OpenGL the hosted Windows runner offers (no GPU: Microsoft's GDI software
  # renderer, GL 1.1). The tests accept what that renderer cannot do (no ARB_create_context, no swap control) but still check
  # that nothing weaker than the request is ever returned. Real-driver results come from local runs
  # (`ctest --preset ci-gpu`) or a self-hosted GPU runner.
  wgl-software:
    name: wgl-integration (software GL)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: 'Locate an ANGLE build (Chrome ships libEGL.dll, libGLESv2.dll and d3dcompiler_47.dll)'
        id: angle
        shell: pwsh
        run: |
          $f = Get-ChildItem "C:\Program Files\Google\Chrome\Application","C:\Program Files (x86)\Google\Chrome\Application" -Recurse -Filter libEGL.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($f) { "dir=$($f.DirectoryName -replace '\\','/')" >> $env:GITHUB_OUTPUT; Write-Host "ANGLE: $($f.FullName)" } else { Write-Host "no ANGLE found: the EGL-on-Windows tests are not built" }
      - name: Configure and build
        shell: bash
        run: |
          cmake --preset ci -DTESSERA_ANGLE_DIR="${{ steps.angle.outputs.dir }}"
          cmake --build --preset ci --config Debug --parallel
      - name: Run WGL integration test
        run: ctest --test-dir build/ci -C Debug -L gpu --output-on-failure

  # The GLX and EGL integration tests against a virtual X server with Mesa's software renderer (no GPU needed).
  gl-linux-software:
    name: glx + egl integration (Xvfb + Mesa llvmpipe)
    runs-on: ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install X server and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libgles2
      - name: Configure and build
        run: |
          cmake --preset ci -DCMAKE_BUILD_TYPE=Debug
          cmake --build --preset ci --parallel
      - name: Run GLX and EGL integration tests
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ctest --test-dir build/ci -L gpu --output-on-failure

  # The real-framework CGL smoke test. Written without access to a Mac and never run: informational until it has
  # passed once. Hosted macOS runners are GPU-less VMs, so a core profile may legitimately be unavailable there.
  cgl-macos:
    name: cgl real-framework test (macOS, informational)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        run: |
          cmake --preset ci -DCMAKE_BUILD_TYPE=Debug
          cmake --build --preset ci --parallel
      - name: Run the CGL test against OpenGL.framework
        run: ctest --test-dir build/ci -L gpu -V
      - name: What the runner's OpenGL offers
        run: ./build/ci/tools/diag/tessera-diag || true

  # The Java bindings on macOS (JDK 21 = JNI, JDK 25 = FFM) against the hosted VM's OpenGL.framework. The JavaFX/AWT/GLFW
  # tests need a window server session; the first run shows which of them the runner can host.
  java-macos:
    name: java (JDK ${{ matrix.java }}, macOS, informational)
    runs-on: macos-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Fetch the pinned LWJGL and JavaFX jars
        run: python3 scripts/fetch-java-deps.py
      - name: Configure and build
        run: |
          cmake --preset java -DCMAKE_BUILD_TYPE=Debug
          cmake --build --preset java --parallel
      - name: Run the Java tests
        run: ctest --preset java --output-on-failure -V

  # The Java bindings and their tests on Linux: JNI on Java 21, FFM on Java 25, under a virtual X server with Mesa's
  # software renderer. The JavaFX OpenGL pipeline test needs GTK and prism.forceGPU (JavaFX does not allow-list Mesa).
  java-linux:
    name: java (JDK ${{ matrix.java }}, Xvfb + Mesa)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Install X server, Mesa and GTK (for JavaFX)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libgtk-3-0t64 libxtst6
      - name: Fetch the pinned LWJGL and JavaFX jars
        run: python3 scripts/fetch-java-deps.py
      - name: Configure and build
        run: |
          cmake --preset java -DCMAKE_BUILD_TYPE=Debug
          cmake --build --preset java --parallel
      - name: Run the Java tests
        run: xvfb-run -a -s "-screen 0 1280x1024x24" ctest --preset java --output-on-failure

  # Style and static analysis: clang-format 18.1.8 (--Werror) and the clang-tidy build.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          python3 -m pip install --user clang-format==18.1.8
          sudo apt-get update
          sudo apt-get install -y clang-tidy ninja-build
      - name: clang-format
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          git ls-files '*.c' '*.cpp' '*.h' '*.hpp' | xargs clang-format --dry-run --Werror
      - name: clang-tidy
        run: |
          cmake --preset tidy
          cmake --build --preset tidy --parallel
      - name: C API reference (Doxygen, warnings are errors)
        run: |
          sudo apt-get install -y doxygen
          doxygen docs/Doxyfile
